pull_method = "Aggregated from NYU Stern Call Report data"
path = "./_data/ftsfr_nyu_call_report_leverage_ew_quartile.parquet"
date_col = "ds"
docs = """
## Bank Leverage by Size Quartile (Equal-Weight)

Quarterly leverage ratios aggregated by bank size quartile. Each quartile contains 25% of banks by count.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Quartile identifier (Q1_small_ew, Q2_ew, Q3_ew, Q4_large_ew) |
| ds | Date |
| y | Mean leverage ratio (Assets/Equity) for quartile |

### Notes

- Banks are sorted by initial total assets (first observation)
- Equal-weight: simple mean of leverage ratios within each quartile
- Q1 = smallest banks, Q4 = largest banks
"""


## Bank Leverage by Size Quartile (Value-Weight)

Quarterly leverage ratios aggregated by bank size quartile. Each quartile contains 25% of total banking assets.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Quartile identifier (Q1_small_vw, Q2_vw, Q3_vw, Q4_large_vw) |
| ds | Date |
| y | Asset-weighted mean leverage ratio (Assets/Equity) for quartile |

### Notes

- Banks are sorted by initial total assets (first observation)
- Value-weight: asset-weighted mean of leverage ratios within each quartile
- Q1 = smallest banks (by cumulative assets), Q4 = largest banks
- Shows where system-wide leverage concentrates
"""

[charts.bank_leverage_ew_quartile]
name = "Bank Leverage by Size Quartile (Equal-Weight)"

[project]
name = "NYU Call Report"
description = "Bank-level leverage and liquidity metrics from regulatory call reports"
contributors = [
    "Jeremiah Bejarano",
]
repo_url = "https://github.com/ftsfr/nyu_call_report"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]

[notebooks.summary_nyu_call_report_ipynb]
name = "summary_nyu_call_report_ipynb"
description = "Summary statistics and visualization of NYU Call Report data"
path = "_output/summary_nyu_call_report_ipynb.ipynb"
publishable = true

[dataframes.ftsfr_nyu_call_report_leverage]
name = "ftsfr_nyu_call_report_leverage"
description = "Bank-level leverage (Assets/Equity) from regulatory call reports"
sources = [
    "nyu_call_report",
]
providers = [
    "NYU Stern",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://pages.stern.nyu.edu/~pschnabl/data/data_callreport.htm",
]
tags = [
    "banking",
    "leverage",
    "regulation",
]
access_types = [
    "Public",
]
license = "Public"
restrictions = "No"
pull_method = "Downloaded from NYU Stern website"
path = "./_data/ftsfr_nyu_call_report_leverage.parquet"
date_col = "ds"
docs = """
## Bank-Level Leverage

This dataset contains quarterly leverage ratios (Total Assets / Total Equity) for individual banks.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Bank identifier (RSSD ID) |
| ds | Date |
| y | Leverage ratio (Assets/Equity) |

### Notes

- Data from regulatory call reports (1976-2020)
- Banks with zero or negative equity are excluded
"""

